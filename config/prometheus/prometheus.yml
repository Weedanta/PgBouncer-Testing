# Subbab 3.4: every exporter is scraped every 5 s.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: pgbouncer
    static_configs: [{targets: ["pgbouncer-exporter:9127"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  # DEV-020: per-container CPU and memory (cAdvisor metric names), see docker-compose.yml
  - job_name: containers
    static_configs: [{targets: ["container-exporter:9338"]}]
