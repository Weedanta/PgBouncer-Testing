# Series exported from Prometheus for every run window (Tabel 3.8), saved as Parquet in
# the run directory. `{db}` is replaced by the run's database name.
# `required: true` series are checked by `make check-metrics` during M4 validation:
# exporter metric names can change between exporter releases, so verify them on the
# real stack before calibration and fix the expression here if one is missing.
step_s: 5
series:
  # --- PostgreSQL (postgres_exporter: pg_stat_activity, pg_stat_database) ------------
  pg_backends_by_state:
    expr: 'sum by (state) (pg_stat_activity_count{datname="{db}"})'
    required: true
  pg_xact_commit_rate:
    expr: 'rate(pg_stat_database_xact_commit{datname="{db}"}[30s])'
    required: true
  pg_deadlocks:
    expr: 'pg_stat_database_deadlocks{datname="{db}"}'
    required: true
  pg_blks_hit_rate:
    expr: 'rate(pg_stat_database_blks_hit{datname="{db}"}[30s])'
    required: true
  pg_blks_read_rate:
    expr: 'rate(pg_stat_database_blks_read{datname="{db}"}[30s])'
    required: true
  # --- PgBouncer (pgbouncer_exporter: SHOW POOLS, SHOW STATS) ------------------------
  pgb_cl_active:
    expr: 'sum(pgbouncer_pools_client_active_connections{database="{db}"})'
    required: true
  pgb_cl_waiting:
    expr: 'sum(pgbouncer_pools_client_waiting_connections{database="{db}"})'
    required: true
  pgb_sv_active:
    expr: 'sum(pgbouncer_pools_server_active_connections{database="{db}"})'
    required: true
  pgb_sv_idle:
    expr: 'sum(pgbouncer_pools_server_idle_connections{database="{db}"})'
    required: true
  pgb_maxwait_s:
    expr: 'max(pgbouncer_pools_client_maxwait_seconds{database="{db}"})'
    required: false
  pgb_avg_wait_s:
    expr: 'rate(pgbouncer_stats_client_wait_seconds_total{database="{db}"}[30s]) / rate(pgbouncer_stats_sql_transactions_pooled_total{database="{db}"}[30s])'
    required: false
  # --- containers and host (container exporter, DEV-020; node_exporter) ---------------
  cpu_cores_by_container:
    expr: 'sum by (name) (rate(container_cpu_usage_seconds_total{name=~"pgb-(postgres|pgbouncer|client)"}[30s]))'
    required: true
  mem_bytes_by_container:
    expr: 'sum by (name) (container_memory_working_set_bytes{name=~"pgb-(postgres|pgbouncer|client)"})'
    required: true
  # RSS = anonymous (private) memory of the container's processes. It leaves out the page
  # cache and PostgreSQL's shared memory (shared_buffers), so its growth with the number of
  # connections is the private memory per connection (RM2 v5, memory and capacity).
  mem_rss_bytes_by_container:
    expr: 'sum by (name) (container_memory_rss{name=~"pgb-(postgres|pgbouncer)"})'
    required: true
  container_start_time:
    expr: 'max by (name) (container_start_time_seconds{name=~"pgb-(postgres|pgbouncer)"})'
    required: true
  disk_read_bytes_rate:
    expr: 'sum(rate(node_disk_read_bytes_total[30s]))'
    required: true
  disk_written_bytes_rate:
    expr: 'sum(rate(node_disk_written_bytes_total[30s]))'
    required: true
  context_switches_rate:
    expr: 'rate(node_context_switches_total[30s])'
    required: true
