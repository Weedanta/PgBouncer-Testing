# Single source of truth for the research design.
#
# Source: proposal "Skripsi-Revisi Wedanta (Revisi Bimbingan 20 Okt) v5", Bab 1-3
# (supervisor meeting 20 Oct 2026: at least five gradual concurrency levels starting low,
# memory per connection and connection capacity at an equal memory budget, short campaign).
# Defaults follow the proposal text literally. Every value that is NOT stated in the
# proposal (an implementation detail) or that departs from it is tagged with a DEV-xxx id
# and explained in docs/DEVIATIONS.md. Decisions D1-D13 are in docs/DECISIONS.md.
# Do not edit values here after `make lock` (the runner refuses to start on a mismatch).
schema_version: 2

seeds:
  master: 20261001            # plan, path order and per-pair pgbench seeds derive from this

# ---------------------------------------------------------------------------
# Factorial design (Subbab 3.2, Tabel 3.1, Tabel 3.7)
# Factor A: connection path (2 levels). Factor B: concurrency (5 levels).
# Repeated for each of the 5 request profiles, 3 rounds (replications, Jain 1991).
# 2 x 5 x 5 x 3 = 150 measured runs, about 2.5 h (10 s warmup + 30 s measurement + reset).
# ---------------------------------------------------------------------------
design:
  paths: [direct, pgbouncer]      # direct = baseline :5432, pgbouncer = treatment :6432
  # 1 is below the pool size (pure cost of the extra hop), 10 just above it, 100-1000 far
  # above it. Roughly log-spaced so the trend is visible over three orders of magnitude.
  concurrency: [1, 10, 100, 500, 1000]
  high_concurrency: [500, 1000]   # scope of H1/H2 (Subbab 1.2)
  profiles: [R1, R2, R3, R4, R5]
  rounds: 3                       # replications r of the two-factor design (Tabel 3.7 v5)
  warmup_s: 10                    # not recorded; dataset is in memory (scale 100)
  measure_s: 30
  randomize_path_order: true      # Tabel 3.7: path order randomized every round
  shuffle_cells_within_round: false  # DEV-005 (optional, OFF = proposal text)

# ---------------------------------------------------------------------------
# Host resources (Subbab 3.4): separate cpuset per container.
# `make probe` turns this policy into concrete cpusets in config/host.env.
# ---------------------------------------------------------------------------
resources:
  layout: dedicated               # dedicated = proposal (own cores per container)
                                  # small_server = DEV-001 + DEV-003 (optional)
  host_reserved_cores: 1          # physical cores left to the OS / Docker daemon
  monitoring_cores: 1             # exporters + Prometheus + Grafana
  pgbouncer_cores: 1              # PgBouncer is single-threaded: one physical core
  client_core_share: 0.25         # of the remaining physical cores (validated in smoke)
  memory_mb:                      # postgres gets what is left after these
    host_reserved: 2048
    monitoring: 1536
    client: 3072
    pgbouncer: 256
  small_server:                   # only used when layout = small_server (DEV-001, DEV-003)
    vcpus: 2
    memory_mb: 4096
    pgbouncer_memory_mb: 128

# ---------------------------------------------------------------------------
# PostgreSQL (control variables, identical on both paths, Tabel 3.1)
# Only max_connections = 1100 is stated in the proposal; the rest are implementation
# details derived from the postgres container memory (DEV-009).
# ---------------------------------------------------------------------------
postgres:
  major: 18
  port: 5432
  max_connections: 1100           # Subbab 3.4
  shared_buffers_fraction: 0.25
  effective_cache_size_fraction: 0.70
  work_mem: 4MB                   # 1000 backends on the direct path
  maintenance_work_mem: auto      # min(1GB, postgres memory / 8)
  huge_pages: try
  fsync: "on"
  synchronous_commit: "on"
  full_page_writes: "on"
  random_page_cost: 1.1
  checkpoint_timeout: 30min
  checkpoint_completion_target: 0.9
  max_wal_size: 32GB              # verified: no checkpoint inside a 360 s run (flag)
  password_encryption: scram-sha-256

# ---------------------------------------------------------------------------
# PgBouncer (Tabel 3.2). Pool size is a RULE; the number is filled in after the
# host spec is locked (`make probe`) and checked in calibration (Subbab 3.3).
# ---------------------------------------------------------------------------
pgbouncer:
  port: 6432
  pool_mode: transaction
  pool_size_rule: "2 * physical_cores + effective_spindles"
  core_basis: postgres_physical_cores # D1: cores of the PostgreSQL cpuset
  effective_spindles: 0               # D2: dataset fits in memory (Subbab 3.3.1, 3.5.2 v4)
  max_db_connections: equal_to_pool   # Tabel 3.2
  reserve_pool_size: 0
  max_client_conn: 1100
  query_wait_timeout: 120             # PgBouncer default
  max_prepared_statements: 200        # PgBouncer default since 1.24.0 (written explicitly)
  auth_type: scram-sha-256            # same method as pg_hba.conf on the direct path
  match_listen_backlog: true          # D10 / DEV-006

net_sysctls:                          # identical on client, postgres, pgbouncer
  net.core.somaxconn: 4096
  net.ipv4.ip_local_port_range: "10240 65000"
  net.ipv4.tcp_tw_reuse: 1
nofile_limit: 65536

# ---------------------------------------------------------------------------
# Datasets. The smoke dataset lives in its own database so the real one is never
# touched by smoke tests.
# ---------------------------------------------------------------------------
datasets:
  campaign:
    database: bench
    template: bench_template
    scale: 100                  # Tabel 3.7 v4 (about 1.5 GB, fits in memory; Subbab 3.5.2).
                                # Below the 1000-client top level on purpose: R3/R4 row-lock
                                # contention on pgbench_branches is recorded (lock waits,
                                # deadlocks) and compared with R1/R2/R5 (Subbab 3.5.2, 3.8).
    r5_seed_fraction: 1.0
  smoke:
    database: bench_smoke
    template: bench_smoke_template
    scale: 10
    r5_seed_fraction: 0.05

# ---------------------------------------------------------------------------
# Workload (Tabel 3.5, 3.6, 3.7)
# ---------------------------------------------------------------------------
pgbench:
  init_steps: dtGvp           # server-side data generation
  protocol: prepared          # -M prepared (protocol-level prepared statements)
  # -j. Tabel 3.7 says "= cores of the pgbench container". That deadlocks with -M prepared
  # behind a transaction pooler: pgbench prepares each statement with a blocking
  # PQprepare() at first use, so one client waiting for a pooled server blocks its whole
  # thread, including other clients of that thread that hold the pool's servers mid-
  # transaction (verified with pgbench 18.6 + PgBouncer 1.26.0). per_client gives every
  # client its own thread (-j = -c) on BOTH paths. DEV-013. Alternatives: cpuset | <int>.
  threads: per_client
  max_tries: 1
  progress_s: 5               # 6 progress lines per 30 s run, used to check stability
  failures_detailed: true
  no_vacuum: true             # -n: pgbench must not vacuum/truncate before a run (DEV-010)

profiles:
  R1:
    description: Baca (select-only, koneksi persisten)
    builtin: select-only
    connect_per_transaction: false
    writes: false
  R2:
    description: Tulis (UPDATE + INSERT dalam satu transaksi, koneksi persisten)
    scripts: {workloads/r2_write.sql: 1}
    connect_per_transaction: false
    writes: true
  R3:
    description: Campuran (TPC-B-like bawaan pgbench, koneksi persisten)
    builtin: tpcb-like
    connect_per_transaction: false
    writes: true
  R4:
    description: Campuran dengan koneksi per permintaan (R3 + --connect)
    builtin: tpcb-like
    connect_per_transaction: true   # pgbench -C
    writes: true
  R5:
    description: Campuran berbobot, skenario kompetisi daring (Tabel 3.6)
    scripts:                         # weights must sum to 100; locked with the config
      workloads/r5/autosave.sql: 35
      workloads/r5/ambil_soal.sql: 25
      workloads/r5/heartbeat.sql: 15
      workloads/r5/login.sql: 10
      workloads/r5/leaderboard.sql: 5
      workloads/r5/daftar.sql: 4
      workloads/r5/submit.sql: 4
      workloads/r5/nomor_peserta.sql: 2
    connect_per_transaction: false
    writes: true

r5_seed:                      # D12 (sizes are not in the proposal, DEV-011)
  random_seed: 0.20261001     # passed to setseed(); must be in [-1, 1]
  peserta: 200000
  kompetisi: 20
  soal_per_kompetisi: 50
  jawaban_fraction: 0.5
  hasil_fraction: 0.3
  sesi_fillfactor: 90

# ---------------------------------------------------------------------------
# Reset between runs (Subbab 3.4 "Kendali Variabel dan Isolasi")
# ---------------------------------------------------------------------------
reset:
  policy: write_profiles_only # proposal text. DEV-004 (optional): every_run
  prewarm: false              # proposal: 60 s warmup only. DEV-007 (optional): true
  create_strategy: FILE_COPY

# ---------------------------------------------------------------------------
# Calibration and lock (RM1, Subbab 3.3)
# ---------------------------------------------------------------------------
calibration:
  duration_s: 30                      # Subbab 3.3.2 v5: short 30 s checks
  warmup_s: 5                         # DEV-012 (not measurement data)
  concurrency: [100, 1000]            # two levels far above the pool size (Subbab 3.3.2 v5)
  rotation_transactions: 50
  pool_size_factors: [0.5, 1, 2]      # "setengah dan dua kali nilai tersebut"
  pool_size_repetitions: 3
  pool_size_profiles: [R3, R5]        # D3
  tps_min_ratio: 0.95                 # D3
  p95_max_ratio: 1.10                 # D3
  max_adjustments_per_value: 1        # "disesuaikan satu kali"

# ---------------------------------------------------------------------------
# Runner
# ---------------------------------------------------------------------------
flags:
  client_cpu_saturation: 0.95         # of the client cpuset
  pgbouncer_cpu_saturation: 0.95      # of one core
  log_count_tolerance: 0               # transactions in --log must equal pgbench's count

retry:
  infra_max_retries: 1                # D11; SUT outcomes are never retried

preflight:
  max_load_avg_per_cpu: 0.5
  min_free_disk_gb: 50

raw_logs:
  keep: true                          # D9
  compression: zstd

monitoring:
  scrape_interval_s: 5                # Subbab 3.4
  scrape_timeout_s: 4
  retention_days: 60
  sampler_interval_s: 5               # runner's own SHOW POOLS / pg_stat_activity sampler

# ---------------------------------------------------------------------------
# Analysis (Subbab 3.6)
# ---------------------------------------------------------------------------
analysis:
  alpha: 0.05
  # Subbab 3.6 v5: two-factor full factorial with replications (Jain, 1991) per profile and
  # metric, on log-transformed values. H1/H2 = one-sided contrast pgbouncer vs direct at
  # c = 500 and 1000 using the pooled error of the model (df = 2 x 5 x (3 - 1) = 20).
  primary_test: factorial_anova_log
  log_transform: true
  multiple_comparison: holm           # family = 20 (H1 + H2 at c=500,1000 x 5 profiles)
  effect_size: partial_eta_squared    # interaction and main effects (Fritz dkk., 2012)
  # Memory and capacity (RM2 v5): per-connection memory = slope of container RSS against
  # the number of connections; capacity = connections that fit in an equal memory budget.
  memory:
    budgets_mb: [256, 512, 1024]
    persistent_profiles_only: true    # R4 (-C) opens and closes backends all the time
  decimal_separator: ","
  figure_dpi: 300

# ---------------------------------------------------------------------------
# Smoke campaign. Outputs are labeled SMOKE everywhere and never used in the thesis.
# ---------------------------------------------------------------------------
smoke:
  concurrency: [1, 10, 50]
  rounds: 2
  warmup_s: 5
  measure_s: 10
  max_minutes: 45
