[project]
name = "pgbouncer-playground"
version = "0.1.0"
description = "Measurement instrument: impact of PgBouncer on PostgreSQL throughput and latency (skripsi Weda, FILKOM UB)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "zstandard>=0.23",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
playground = "playground.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playground", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["results", "secrets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# try/except/pass reads more clearly than contextlib.suppress in the reset code
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"playground/cli.py" = ["B008"]          # typer declares options in argument defaults
"playground/calibrate.py" = ["E501"]    # long Indonesian report sentences

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
